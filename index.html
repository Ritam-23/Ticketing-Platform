    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchHandler = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHandler;
            },
            set: function(fn) {
              fetchHandler = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return fetchHandler; },
                set: function(fn) { fetchHandler = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
